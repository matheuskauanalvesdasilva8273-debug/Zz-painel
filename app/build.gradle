apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.zz.painel"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    kotlinOptions { jvmTarget = '17' }
    namespace 'com.zz.painel'
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}
